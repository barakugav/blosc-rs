version: 2
updates:
  # Cargo
  - package-ecosystem: cargo
    directories:
      - /blosc-rs
      - /blosc-rs-sys
    schedule:
      interval: monthly
    groups:
      rust-patch-updates:
        update-types:
          - patch

  # Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
